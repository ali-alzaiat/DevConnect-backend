services:
  # --- MySQL database ---
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: devconnect
    ports:
      - '3307:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-p1234']
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 40s # Increased to allow full initialization

  # --- Redis cache ---
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  # --- NestJS app ---
  app:
    build: .
    container_name: nest-app
    restart: always
    env_file:
      - .env
    ports:
      - '3001:3001'
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "
        echo 'Waiting for MySQL to be fully ready...' &&
        sleep 25 &&
        npx prisma migrate reset --force &&
        npm run start:dev
      "
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    working_dir: /usr/src/app

volumes:
  mysql_data:
  redis_data:
